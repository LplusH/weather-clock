name: 每日一句歌詞

on:
  schedule:
    # UTC 22:10 = 香港/北京時間 06:10，早上醒來就是新的句子
    - cron: "10 22 * * *"
  workflow_dispatch: {}         # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write               # 提交 today.txt / lyric.bin 回倉庫
  pages: write                  # 部署到 Pages
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 渲染中文必須有 CJK 字體，runner 預設沒有
      - name: 安裝中文字體
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: pip install pillow

      - name: 選歌 → 抓詞 → AI 選句 → 渲染位圖
        env:
          WC_AI_BASE: ${{ secrets.WC_AI_BASE }}
          WC_AI_KEY: ${{ secrets.WC_AI_KEY }}
          WC_AI_MODEL: ${{ secrets.WC_AI_MODEL }}
          WC_SOURCE: ai
        run: |
          python pipeline/daily.py --render
          python pipeline/render_strip.py

      - name: 提交結果
        run: |
          git config user.name  "lyric-bot"
          git config user.email "lyric-bot@users.noreply.github.com"
          git add site state cache
          git commit -m "daily: $(date -u +%F)" || echo "今天沒有變化"
          git push

      # ---- 關鍵：同一個 job 裡直接部署 ----
      # 用 GITHUB_TOKEN 推送的提交不會觸發其他 workflow（GitHub 反遞歸規則），
      # 所以不能依賴 pages.yml 去響應 push，必須在這裡部署。
      - uses: actions/configure-pages@v5

      - name: 上傳 site 目錄
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
